; PlatformIO Project Configuration File
;
; Huawei R4850/R4875 rectifier touchscreen controller
; ESP32-S3 (N16R8: 16MB flash / 8MB octal PSRAM) + LVGL/TFT_eSPI + FT6336U + TWAI
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
; The firmware source lives in ../ui (not ./src) so it stays the single
; canonical copy shared by this PIO project -- there's no duplicate to drift
; out of sync. See ../README.md.
src_dir = ../ui

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Vendored libraries (ui, lvgl, TFT_eSPI, ArduinoJson, HuaweiCAN) live directly
; in ./lib now, PlatformIO's default lib_dir -- no lib_extra_dirs needed.
; HuaweiCAN in there is a symlink back to /SW/libraries/HuaweiCAN so the
; CAN_controller bench sketch (Arduino IDE) and this PIO build share the
; exact same driver code instead of two copies that can drift apart.

; --- ESP32-S3-DevKitC-1 N16R8: 16MB flash (QIO) / 8MB PSRAM (Octal/OPI) ---
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_freq = 80m
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    ; ESP32-S3-DevKitC-1 boards with a separate USB-UART bridge chip (CP2102/
    ; CH340, a second "UART" USB port) do NOT need this and Serial already
    ; works over that port. Boards that expose ONLY the S3's native USB port
    ; need it, or Serial output goes nowhere. Uncomment if `pio device monitor`
    ; shows nothing after flashing:
    ; -DARDUINO_USB_CDC_ON_BOOT=1
    ; -DARDUINO_USB_MODE=1

monitor_speed = 115200
upload_speed = 921600
